(()=>{const box=$('#dokumen');box.innerHTML=`<div class="sec-in">${head('dokumen','Dokumen pendukung','Ijazah, sertifikat, dan pengalaman kerja. Dilindungi kode akses.')}<div id="dk"></div></div>`;
const dk=$('#dk'),TE=new TextEncoder();let M,pw='',G=0,I=0,U={},bad=0;
const wipe=()=>{Object.values(U).forEach(URL.revokeObjectURL);U={};pw='';G=I=0};
async function dec(f){if(U[f])return U[f];const b=new Uint8Array(await(await fetch('dokumen/'+f)).arrayBuffer());
const km=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:M.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const o=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28));return U[f]=URL.createObjectURL(new Blob([o],{type:'image/jpeg'}))}
function lock(msg=''){wipe();dk.innerHTML=`<form class="dk-lock tile" id="dkf">${ico('shield','indigo','lg')}<p>Dokumen ini bersifat pribadi. Hubungi saya untuk mendapatkan kode akses, lalu masukkan di sini.</p><div class="dk-r"><input id="dkp" type="password" autocomplete="off" placeholder="Kode akses" aria-label="Kode akses" required><button class="btn" type="submit">Buka dokumen</button></div><small id="dke" role="alert">${msg}</small></form>`;
$('#dkf').onsubmit=async e=>{e.preventDefault();const b=$('#dkf button'),m=$('#dke');b.disabled=true;m.textContent='Memeriksa…';pw=$('#dkp').value;
try{M=M||await(await fetch('dokumen/manifest.json')).json();await dec(M.groups[0].items[0].f);bad=0;show()}
catch(x){pw='';bad++;m.textContent=x instanceof TypeError?'Dokumen tidak dapat dimuat.':'Kode akses salah.';await new Promise(r=>setTimeout(r,Math.min(bad*1200,6000)));b.disabled=false}}}
function show(){const g=M.groups[G],it=g.items[I],n=g.items.length;
dk.innerHTML=`<div class="dk-tabs" role="tablist">${M.groups.map((x,i)=>`<button class="dk-tab" role="tab" aria-selected="${i===G}" data-g="${i}">${esc(x.g)}<i>${x.items.length}</i></button>`).join('')}<button class="dk-tab dk-out" id="dkx">Kunci kembali</button></div>

<div class="dk-act"><a class="btn" id="dkd" download="${it.n.replace(/[^\w]+/g,'_')}.jpg" href="#">Unduh gambar ini</a></div>`;
dec(it.f).then(u=>{const im=$('#dki');if(im){im.src=u;$('#dkd').href=u}});const nx=g.items[(I+1)%n];dec(nx.f).catch(()=>{});
$$('.dk-tab[data-g]').forEach(b=>b.onclick=()=>{G=+b.dataset.g;I=0;show()});$('#dkx').onclick=()=>lock();
$$('.dk-nav').forEach(b=>b.onclick=()=>{I=(I+ +b.dataset.s+n)%n;show()})}
box.addEventListener('keydown',e=>{if(!M||!pw||!$('#dki'))return;const n=M.groups[G].items.length;if(e.key==='ArrowRight'){I=(I+1)%n;show()}else if(e.key==='ArrowLeft'){I=(I-1+n)%n;show()}});
let tx=0;box.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});box.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(pw&&$('#dki')&&Math.abs(d)>60){const n=M.groups[G].items.length;I=(I+(d<0?1:-1)+n)%n;show()}});
addEventListener('pagehide',wipe);lock()})();

/* ===== Perilaku umum ===== */
const root=document.documentElement,nav=$('#nav'),mn=$('#mn'),pg=$('#pg');
$('#tt').addEventListener('click',()=>{const t=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('tema',t)}catch(e){}});
const setMenu=o=>{nav.classList.toggle('open',o);mn.setAttribute('aria-expanded',o);mn.setAttribute('aria-label',o?'Tutup menu':'Buka menu')};
mn.addEventListener('click',()=>setMenu(!nav.classList.contains('open')));
nav.addEventListener('click',e=>{if(e.target.closest('a'))setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
const sc=()=>{const h=root.scrollHeight-innerHeight;pg.style.transform=`scaleX(${h>0?Math.min(scrollY/h,1):0})`};
addEventListener('scroll',sc,{passive:true});sc();
addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}},{passive:true});
const links=$$('a',nav);
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;links.forEach(a=>{if(a.getAttribute('href')==='#'+e.target.id)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')})}),{rootMargin:'-40% 0px -55% 0px'});
$$('main>section.sec').forEach(s=>spy.observe(s));
</script>
</body>
</html>
