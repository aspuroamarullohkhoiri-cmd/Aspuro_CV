const bar=$('#bar');addEventListener('scroll',()=>{bar.style.transform=`scaleX(${scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)})`},{passive:true});
// muncul saat digulir + hitung angka
const io=new IntersectionObserver((es,o)=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('on');const n=e.target.querySelector('[data-n]');if(n)count(n);o.unobserve(e.target)}),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
function count(el){const to=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/1300);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
// penanda menu aktif
const links=[...document.querySelectorAll('.nav a')];
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('main>section').forEach(s=>spy.observe(s));
// jendela detail
let K='exp',cur=0,last;
function show(k,i,d){K=k;const a=L[k];cur=(i+a.length)%a.length;const e=a[cur];$('#md').style.setProperty('--h',e.h);
$('#md').innerHTML=`<div class="mb"></div><button class="x" aria-label="Tutup">&times;</button><div class="mh">${tile(e.i,e.h,'lg')}<div><p class="tp">${e.t}</p><h3 id="mt">${e.p}</h3><p class="co">${e.c}</p></div></div><ul>${e.b.map((b,j)=>`<li style="--d:${j}">${b}</li>`).join('')}</ul>${e.v?vals(e.v):''}${a.length>1?`<div class="mn"><button data-d="-1">Sebelumnya</button><span>${cur+1} dari ${a.length}</span><button data-d="1">Berikutnya</button></div>`:''}`;const f=d?$(`#md [data-d="${d}"]`):$('#md .x');f&&f.focus()}
function openM(k,i){last=document.activeElement;show(k,i);ov.classList.add('on');ov.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeM(){ov.classList.remove('on');ov.setAttribute('aria-hidden','true');document.body.style.overflow='';last&&last.focus()}
document.addEventListener('click',e=>{const it=e.target.closest('[data-k]');if(it)return openM(it.dataset.k,+it.dataset.i);
if(e.target===ov||e.target.closest('.x'))return closeM();const b=e.target.closest('[data-d]');if(b)show(K,cur+ +b.dataset.d,b.dataset.d)});
addEventListener('keydown',e=>{if(!ov.classList.contains('on'))return;if(e.key==='Escape')closeM();if(e.key==='ArrowRight')show(K,cur+1,1);if(e.key==='ArrowLeft')show(K,cur-1,-1)});
</script>
</body></html>
