const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const C=D.contact,FULL=D.name+', '+D.deg;
const NAV=[['profil','Profil'],['pengalaman','Pengalaman'],['erp','Sistem ERP'],['keahlian','Keahlian'],['pendidikan','Pendidikan'],['kontak','Kontak']];
const IC={
  mail:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
  dl:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>',
  wa:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>'
};
const list=a=>a.length>1?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="d">${esc(a[0])}</p>`;
const rowExp=(e,compact)=>`<li class="row${compact?' c':''}"><div class="when">${esc(e.t)}</div><div class="what"><h3>${esc(compact?e.p.replace(/\s*\(Magang\)/,''):e.p)}</h3><p class="org">${esc(e.c)}</p>${list(e.b)}</div></li>`;

document.title=FULL+' — CV';
$('#brand').textContent=D.name;
$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join('');

$('#top').innerHTML=`<div class="ht">
  <h1>${esc(D.name)} <span class="deg">${esc(D.deg)}</span></h1>
  <p class="ttl">${D.title.map(t=>`<span>${esc(t)}</span>`).join('')}</p>
  <p class="lead">${esc(D.lead)}</p>
  <div class="cta"><a class="btn pri" href="#erp">Lihat sistem ERP</a><a class="btn" href="${esc(C.cv)}" download>${IC.dl}Unduh CV</a></div>
  <dl class="facts">${D.facts.map(f=>`<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>
</div>
<div class="ph"><img src="${PHOTO}" alt="Foto ${esc(D.name)}" width="480" height="640" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ini',textContent:'AK'}))"></div>`;

$('#profil').innerHTML=`<div class="sec-in"><div class="sec-h"><h2 id="h-profil">Profil</h2></div><div><p class="sum">${esc(D.sum)}</p><ul class="hl">${D.hl.map(h=>`<li><b>${esc(h[0])}</b><span>${esc(h[1])}</span></li>`).join('')}</ul></div></div>`;

const main=D.exp.filter(e=>!/\(Magang\)/.test(e.p)),intern=D.exp.filter(e=>/\(Magang\)/.test(e.p));
$('#pengalaman').innerHTML=`<div class="sec-in"><div class="sec-h"><h2 id="h-pengalaman">Pengalaman kerja</h2><p>Dari administrasi mutu sampai pengembangan sistem.</p></div><div><ol class="rows">${main.map(e=>rowExp(e)).join('')}</ol><h3 class="grp">Magang</h3><ol class="rows">${intern.map(e=>rowExp(e,1)).join('')}</ol></div></div>`;

const E=D.erp;
$('#erp').innerHTML=`<div class="sec-in erp-in">
  <div class="erp-top"><div><h2 id="h-erp">Sistem ERP</h2><p class="sub">MSB ERP System, ${E.groups.reduce((n,g)=>n+g.m.length,0)} modul</p></div>
  <div><p class="lead2">${esc(E.intro)}</p><dl class="feat">${E.feats.map(f=>`<div><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl></div></div>
  <div class="erp">${E.groups.map(g=>`<div class="erp-row"><div class="erp-lab"><h3>${esc(g.n)}</h3><span>${g.m.length} modul</span></div><ul class="erp-cells">${g.m.map(m=>`<li><h4>${esc(m[0])}</h4><p>${esc(m[1])}</p></li>`).join('')}</ul></div>`).join('')}</div>
  <h3 class="aux-h">Aplikasi pendukung</h3>
  <ul class="aux">${E.aux.map(a=>`<li><h4>${esc(a[0])}</h4><p>${esc(a[1])}</p></li>`).join('')}</ul>
</div>`;

$('#keahlian').innerHTML=`<div class="sec-in"><div class="sec-h"><h2 id="h-keahlian">Keahlian</h2></div><ul class="rows">${D.skills.map(k=>`<li class="row"><div class="lab">${esc(k[0])}</div><div class="chips">${k[1].map(c=>`<span>${esc(c)}</span>`).join('')}</div></li>`).join('')}</ul></div>`;

const lines=a=>a.map(x=>`<p class="d" style="margin-top:0">${esc(x)}</p>`).join('');

/* ===== Perilaku ===== */
const root=document.documentElement,hd=$('#hd'),nav=$('#nav'),mn=$('#mn');
$('#tt').addEventListener('click',()=>{const t=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',t);try{localStorage.setItem('tema',t)}catch(e){}});
const setMenu=o=>{nav.classList.toggle('open',o);mn.setAttribute('aria-expanded',o);mn.setAttribute('aria-label',o?'Tutup menu':'Buka menu')};
mn.addEventListener('click',()=>setMenu(!nav.classList.contains('open')));
nav.addEventListener('click',e=>{if(e.target.closest('a'))setMenu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
addEventListener('scroll',()=>hd.classList.toggle('s',scrollY>8),{passive:true});
const links=[...nav.querySelectorAll('a')];
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;links.forEach(a=>{if(a.getAttribute('href')==='#'+e.target.id)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current')})}),{rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('main>section.sec').forEach(s=>spy.observe(s));
</script>
